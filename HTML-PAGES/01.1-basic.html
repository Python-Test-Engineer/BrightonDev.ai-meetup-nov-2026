<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>OpenRouter API in Browser</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Raleway:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet">
   <link rel="stylesheet" href="01-style.css">
   <script src="config.js"></script>
   <style>
      :root {
         --paper: #f0eee6;
         --surface: #fbfaf7;
         --ivory: #fffdfa;
         --ink: #1f1e1d;
         --muted: #55524c;
         --stone: #8c877c;
         --line: #e2ddd2;
         --terra: #d97757;
         --terra-dark: #c9633f;
      }

      * {
         box-sizing: border-box;
         font-family: -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
         font-size: 16px;
      }

      body {
         width: min(900px, calc(100% - 40px));
         max-width: none;
         margin: 0 auto;
         padding: 42px 0 56px;
         color: var(--ink);
         background: var(--paper);
         font: 16px/1.55 -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
      }

      h1 {
         margin: 0 0 28px;
         text-align: center;
         font: 500 clamp(34px, 5vw, 48px)/1.12 -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
         letter-spacing: -.035em;
      }

      body > input {
         display: block;
         width: 100%;
         min-width: 0;
         margin: 0 0 12px;
         padding: 12px 15px;
         border: 1px solid #ddd7ca;
         border-radius: 10px;
         background: var(--ivory);
         color: var(--ink);
         font: inherit;
      }

      #apiKey {
         -webkit-text-security: disc;
      }

      body > input:focus-visible {
         outline: 2px solid #e3a98f;
         outline-offset: 2px;
      }

      button {
         min-height: 44px;
         padding: 10px 18px;
         border: 1px solid #c9583a;
         border-radius: 8px;
         background: var(--terra);
         color: var(--ivory);
         font: 500 16px/1.2 -apple-system, 'Segoe UI', Inter, Helvetica, Arial, sans-serif;
         cursor: pointer;
         transition: background .15s, border-color .15s;
      }

      button:hover {
         border-color: #b8563a;
         background: var(--terra-dark);
      }

      button:focus-visible {
         outline: 2px solid #e3a98f;
         outline-offset: 2px;
      }

      body > br {
         display: none;
      }

      #result {
         min-height: 150px;
         margin-top: 20px;
         padding: 20px;
         border: 1px solid var(--line);
         border-radius: 16px;
         background: var(--surface);
         color: var(--ink);
      }

      .explain {
         margin: 12px 0;
         padding: 14px 16px;
         border-left: 4px solid var(--terra);
         border-radius: 8px;
         background: #f7e7e0;
         color: #3d3d3a;
         font: inherit;
      }

      .explain .badge {
         display: inline-block;
         margin-right: 8px;
         padding: 3px 9px;
         border-radius: 999px;
         background: var(--terra);
         color: var(--ivory);
         font-size: 12px;
         font-weight: 700;
         letter-spacing: .06em;
      }

      .explain .summary {
         color: var(--ink);
         font-weight: 650;
      }

      .explain .detail {
         margin-top: 7px;
         color: var(--muted);
         line-height: 1.55;
      }

      .explain code {
         padding: 1px 5px;
         border-radius: 4px;
         background: rgba(255, 253, 250, .75);
         font: .9em 'JetBrains Mono', monospace;
      }

      details.raw {
         margin: 12px 0;
         overflow: hidden;
         border: 1px solid #48453f;
         border-radius: 9px;
         background: #272521;
      }

      details.raw > summary {
         padding: 10px 13px;
         color: #f0b49a;
         font: 14px/1.4 'JetBrains Mono', monospace;
         cursor: pointer;
      }

      details.raw > pre {
         margin: 0;
         padding: 14px;
         overflow: auto;
         border-top: 1px solid #48453f;
         background: #1f1e1d;
         color: #f3eee5;
         font: 13px/1.5 'JetBrains Mono', monospace;
         white-space: pre-wrap;
         overflow-wrap: anywhere;
      }

      @media (max-width: 640px) {
         body {
            width: calc(100% - 24px);
            padding: 28px 0 36px;
         }

         #result {
            padding: 14px;
         }
      }
   </style>
   <link rel="stylesheet" href="anthropic-ui.css">
</head>

<body>
   <header class="page-heading">
      <p class="eyebrow">01 · First request</p>
      <h1>OpenRouter API in Browser</h1>
      <p class="lede">Send one prompt to the model and inspect the request and response.</p>
   </header>

   <main class="chat-card" aria-label="Basic API request demo">
      <section class="setup" aria-label="Request setup">
         <label for="apiKey">OpenRouter API key <span>masked on screen</span></label>
         <input type="text" id="apiKey" placeholder="Enter your OpenRouter API key" value="" autocomplete="off"
            data-form-type="other">
         <label for="prompt">Prompt</label>
         <input type="text" id="prompt" placeholder="Enter your prompt" value="Capital of England?">
         <button id="sendBtn" type="button">Send Request</button>
      </section>
      <div id="result" aria-live="polite" aria-label="Request and response details"></div>
   </main>

   <script>
      // 🚀 ======================= DEMO CONSOLE LOGGING =======================
      // 👋 Welcome! Every console.log below is here to explain, step by step,
      //    what this page is doing while it runs. Open your DevTools console.
      console.log('%c🚀 01.1 — OpenRouter API in Browser (the most basic call)', 'font-size:15px;font-weight:bold;color:#0b7a5c');
      console.log('📄 Page loaded. This demo sends ONE prompt to an LLM and prints the answer.');
      console.log('🧠 Note: this call is STATELESS — the model has no memory between clicks.');
      console.log('🔁 Each click below is a completely fresh conversation as far as the AI is concerned.');

      // Pre-fill the API key from config.js (OpenRouter) so the demo works out of the box.
      if (typeof OPENROUTER_API_KEY !== 'undefined' && OPENROUTER_API_KEY) {
         document.getElementById('apiKey').value = OPENROUTER_API_KEY;
         console.log('🔑 API key auto-filled from config.js (OpenRouter).');
      } else {
         console.warn('⚠️ No OPENROUTER_API_KEY found in config.js — type one into the field before sending.');
      }
      console.log('🤖 Model that will be used:', (typeof OPENROUTER_MODEL !== 'undefined' ? OPENROUTER_MODEL : '(not loaded yet)'));
            console.log('🌐 Endpoint that will be called:', (typeof OPENROUTER_API_URL !== 'undefined' ? OPENROUTER_API_URL : '(not loaded yet)'));

            // ─── Audience narration + raw-payload helpers ───
            function explain(badge, summary, detailHtml) {
               const r = document.getElementById('result');
               const box = document.createElement('div');
               box.className = 'explain';
               box.innerHTML = '<span class="badge">' + badge + '</span><span class="summary">' + summary + '</span>' + (detailHtml ? '<div class="detail">' + detailHtml + '</div>' : '');
               r.appendChild(box);
            }
            function showRaw(label, obj) {
               const r = document.getElementById('result');
               const d = document.createElement('details');
               d.className = 'raw';
               d.innerHTML = '<summary>▸ ' + label + ' — click to expand</summary><pre></pre>';
               d.querySelector('pre').textContent = JSON.stringify(obj, null, 2);
               r.appendChild(d);
            }

      document.getElementById('sendBtn').addEventListener('click', async (event) => {
               event.preventDefault(); // never let this trigger a page navigation/reload
               console.log('%c👆 Send button clicked', 'color:#0b7a5c;font-weight:bold');
         console.log('⏳ Awaiting window.openRouterReady — this promise resolves once the key + model are read from OPENROUTER.txt.');
         await window.openRouterReady; // key + model come from OPENROUTER.txt
         console.log('✅ openRouterReady resolved — config is available.');
         // Use the key typed into the field, falling back to the key from OPENROUTER.txt.
         const apiKey = document.getElementById('apiKey').value || OPENROUTER_API_KEY;
         const prompt = document.getElementById('prompt').value;
         const resultDiv = document.getElementById('result');

         console.log('📝 User prompt:', JSON.stringify(prompt));
         console.log('🔑 Using API key:', apiKey ? apiKey.slice(0, 8) + '…(hidden)' : '(none)');


         if (!apiKey) {
            console.warn('🛑 No API key available — aborting the request.');
            resultDiv.innerHTML = '<p style="color: red;">Please enter your API key</p>';
            return;
         }

         resultDiv.innerHTML = '<p>Loading...</p>';
         console.log('⌛ Showing "Loading..." while we wait for the model.');

         system_prompt = `
         You are a helpful assistant. You always answer in a concise manner. 

         You never refuse to answer but do not make things up - just say 'I don't know'. You always try to help the user as much as possible. 

         Convert markdown to HTML when needed so that ouput is properly formatted. Ensure there is a new line after each sentence.`;
         console.group('🧭 System prompt (the AI\'s "personality" + rules)');
         console.log(system_prompt);
         console.groupEnd();

         // ******************** AI BIT ********************
         try {
            // 📦 This array is the "conversation" we send. Chat models are trained on
            //    role-tagged messages: 'system' = instructions, 'user' = the question.
            const requestMessages = [
                           { role: 'system', content: system_prompt }, // Defines how the AI agent behaves (its "personality" and rules).
                           { role: 'user', content: prompt } // The user's input/query for the agent to respond to.
                        ];
                        explain('STEP 1/3', 'We build the request — a list of role-tagged messages.',
                           'Chat models are trained on a conversation, not one string. So we hand over an array with <code>role</code> + <code>content</code>. <code>system</code> (from system_prompt above) sets the personality and rules; <code>user</code> is the actual question. <b>This is the ONLY thing the model ever sees.</b>');
                        showRaw('What we send — the "messages" array', requestMessages);

                        console.group('📤 Building the request');
                        console.log('Roles matter! Models understand "system" (rules) and "user" (question).');
                        console.log('Messages being sent:', requestMessages);
                        console.log('⚙️ max_tokens: 1024  (caps how long the answer can be; ~1 token ≈ 4 characters)');
                        console.log('🎲 temperature: 0.7  (0 = deterministic, 2 = wild; 0.7 is a natural balance)');
                        console.groupEnd();

                        console.log('🌐 Sending POST to', OPENROUTER_API_URL, '…');
                        const t0 = performance.now();
                        const requestBody = {
                           model: OPENROUTER_MODEL,
                           messages: requestMessages,
                           max_tokens: 1024,
                           temperature: 0.7
                        };
                        const response = await fetch(OPENROUTER_API_URL, {
                           method: 'POST',
                           headers: {
                              'Content-Type': 'application/json', // Tells the server we're sending JSON data.
                              'Authorization': `Bearer ${apiKey}`, // Authenticates our request using the OpenRouter API key.
                              ...OPENROUTER_HEADERS // Optional OpenRouter attribution headers.
                           },
                           body: JSON.stringify(requestBody)
                        });
                        explain('STEP 2/3', 'One POST to the API. Nothing else to it.',
                           'We send the array plus two simple knobs: <code>max_tokens:1024</code> (length cap) and <code>temperature:0.7</code> (randomness). OpenRouter routes it to the model and streams back JSON. This step has <b>no memory on the server side</b> — nothing persists between clicks.');
                        showRaw('The full REQUEST body', requestBody);
                        console.log('📡 Response received in', Math.round(performance.now() - t0) + 'ms');
                        console.log('🔢 HTTP status:', response.status, response.statusText, response.ok ? '✅' : '⚠️');

                        const data = await response.json();
                        console.log('API Response:', data);
                        showRaw('The RESPONSE body we get back', data);

                        // ******************** AI BIT ********************

                        // NB No mememory every call is stateless
                        let output = "";

                        if (data.error) {
                           // OpenRouter error responses (bad key, bad model, rate limit...) have NO `choices`.
                           console.error('❌ OpenRouter returned an error:', data.error.message);
                           resultDiv.innerHTML = `<p style="color: red;">Error: ${data.error.message}</p>`;
                        } else if (!data.choices || !data.choices[0]) {
                           console.warn('⚠️ Response had no "choices" array — check the console for the raw payload.');
                           resultDiv.innerHTML = `<p style="color: red;">Unexpected response from OpenRouter (no choices). Check the console.</p>`;
                        } else {
                           const msg = data.choices[0].message.content; // We can drill down for the content of the first message choice to get the 'answer'.
                           console.group('🔎 Reading the answer out of the response');
                           console.log('Path taken: data.choices[0].message.content');
                           console.log('🔚 Finish reason:', data.choices[0].finish_reason, '(why the model stopped)');
                           if (data.usage) {
                              console.log('🧮 Token usage:', data.usage, '(prompt + completion = total billed)');
                           }
                           console.log('💬 Answer:', msg);
                           console.groupEnd();
                           explain('STEP 3/3', 'Drill into <code>data.choices[0].message.content</code> — that is the answer.',
                              'The model wraps its reply in nested JSON. We follow the path <code>choices → 0 → message → content</code> to pull out the text. <code>finish_reason</code> tells us why it stopped, and <code>usage</code> shows the token bill. <b>That is the entire "hello world" of LLM APIs.</b>');
                           resultDiv.innerHTML = resultDiv.innerHTML + `<p><strong>Response:</strong></p><p>${output + '<br>' + msg}</p>`;
                        }
         } catch (error) {
            console.error('💥 Network/parse error during fetch:', error);
            resultDiv.innerHTML = `<p style="color: red;">Error: ${error.message}</p>`;
         }
      });
   </script>
</body>

</html>
